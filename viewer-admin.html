<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>有効応募分析 Viewer管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .shell {
            width: min(760px, calc(100% - 28px));
            margin: 36px auto;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 28px rgba(15,23,42,.06);
        }
        .eyebrow {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: .08em;
        }
        h1 {
            margin: 6px 0 0;
            font-size: 22px;
        }
        .sub {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.7;
        }
        .status {
            margin-top: 16px;
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.7;
            background: #f1f5f9;
            color: #475569;
        }
        .status.ok { background: #ecfdf5; color: #047857; }
        .status.warn { background: #fffbeb; color: #92400e; }
        .status.error { background: #fef2f2; color: #b91c1c; }
        .hidden { display: none !important; }
        .field {
            margin-top: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #475569;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button, .link-button {
            appearance: none;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            color: #334155;
            min-height: 40px;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button.primary { background:#2563eb;color:#fff;border-color:#2563eb; }
        button.danger { background:#fff1f2;color:#be123c;border-color:#fecdd3; }
        button.warning { background:#fffbeb;color:#92400e;border-color:#fde68a; }
        button:disabled { opacity:.45;cursor:not-allowed; }
        .meta {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 150px 1fr;
            border-top: 1px solid #e2e8f0;
        }
        .meta > div {
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
        }
        .meta .key { color:#64748b;font-weight:800;background:#f8fafc; }
        .viewer-url {
            word-break: break-all;
            font-size: 11px;
            color: #475569;
        }
        .footer {
            margin-top: 14px;
            text-align:center;
            color:#94a3b8;
            font-size:10px;
        }
        @media(max-width:560px) {
            .meta { grid-template-columns: 1fr; }
            .meta .key { border-bottom: 0; padding-bottom: 2px; }
            .meta > div:not(.key) { padding-top: 2px; }
        }
    </style>
</head>
<body>
<main class="shell">
    <section class="card">
        <div class="eyebrow">VIEWER CONTROL</div>
        <h1>企業向けViewer管理</h1>
        <div class="sub">
            この画面ではViewerの閲覧停止・再開・URL再発行だけを行います。
            集計設定やマスタは個社Google Sheetで変更してください。
        </div>

        <div id="keyArea" class="field hidden">
            <label for="accessKeyInput">社内用アクセスキー</label>
            <input id="accessKeyInput" type="password" autocomplete="off" placeholder="アクセスキーを入力">
            <div class="actions">
                <button id="saveKeyBtn" type="button" class="primary">保存して読み込む</button>
                <a class="link-button" target="_blank" rel="noopener noreferrer"
                   href="https://docs.google.com/document/d/1c5u4HqoHo5LQRPrXjbWWUJI00BPjTv0Ekk2VA6KtYIQ/edit">
                    アクセスキー確認Doc
                </a>
            </div>
        </div>

        <div id="status" class="status">Viewer情報を確認しています...</div>

        <div id="controlArea" class="hidden">
            <div class="meta">
                <div class="key">Viewer名</div>
                <div id="reportName">-</div>
                <div class="key">閲覧状態</div>
                <div id="viewerState">-</div>
                <div class="key">Viewer URL</div>
                <div id="viewerUrl" class="viewer-url">-</div>
            </div>

            <div class="actions">
                <a id="openViewerBtn" class="link-button" href="#" target="_blank" rel="noopener noreferrer">Viewerを開く</a>
                <button id="copyViewerBtn" type="button">URLをコピー</button>
                <button id="toggleViewerBtn" type="button" class="warning">閲覧を停止</button>
                <button id="rotateViewerBtn" type="button" class="danger">Viewer URLを再発行</button>
                <a id="openSheetBtn" class="link-button" href="#" target="_blank" rel="noopener noreferrer">個社Sheetへ戻る</a>
            </div>
        </div>
    </section>
    <div class="footer">有効応募分析 Viewer管理 / 2026.08.31-etl-v2.12-loading-ux</div>
</main>

<script>
"use strict";

const API_URL =
    "https://script.google.com/macros/s/AKfycbwS_-ptDyhVk5yrNtRB8I32WUJen-xdjKUtp-Rf7Dbdhhg4V9Vw3gneD9K7ErZgP_Y/exec";
const SCHEMA_VERSION = "3.0";
const PAGES_VERSION = "2026.08.31-etl-v2.12-loading-ux";
const ACCESS_KEY_STORAGE_KEY =
    "validApplicationAnalysis.sheetsAccessKey";

let currentState = null;
let busy = false;

function s(value) {
    return value === null || value === undefined
        ? ""
        : String(value).trim();
}

function targetSheetId() {
    const params =
        new URLSearchParams(
            window.location.hash.replace(/^#/, "")
        );
    return s(params.get("sheet"));
}

function getKey() {
    try {
        return s(
            localStorage.getItem(
                ACCESS_KEY_STORAGE_KEY
            )
        );
    } catch (_) {
        return "";
    }
}

function setKey(value) {
    try {
        localStorage.setItem(
            ACCESS_KEY_STORAGE_KEY,
            s(value)
        );
    } catch (_) {}
}

function pageUrl(file) {
    return new URL(file, window.location.href)
        .href.split("#")[0].split("?")[0];
}

function setStatus(message, type = "") {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = "status" + (type ? " " + type : "");
}

function setBusy(flag) {
    busy = !!flag;
    ["saveKeyBtn","copyViewerBtn","toggleViewerBtn","rotateViewerBtn"]
        .forEach(id => {
            const el = document.getElementById(id);
            if (el) el.disabled = busy;
        });
}

async function callApi(action, extra = {}) {
    const accessKey = getKey();
    if (!accessKey) {
        throw new Error("アクセスキーが未設定です。");
    }

    const sheetId = targetSheetId();
    if (!sheetId) {
        throw new Error("対象Sheet IDがURLに含まれていません。個社SheetのViewer管理リンクから開いてください。");
    }

    const response = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        credentials: "omit",
        headers: {
            "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify({
            action,
            schemaVersion: SCHEMA_VERSION,
            pagesVersion: PAGES_VERSION,
            accessKey,
            targetSpreadsheetId: sheetId,
            viewerBaseUrl: pageUrl("report.html"),
            manageBaseUrl: pageUrl("index.html"),
            maintenanceBaseUrl: pageUrl("maintenance.html"),
            viewerAdminBaseUrl: pageUrl("viewer-admin.html"),
            ...extra
        })
    });

    const text = await response.text();
    let data;

    try {
        data = JSON.parse(text);
    } catch (_) {
        throw new Error("API応答を解析できませんでした。");
    }

    if (!data?.ok) {
        const error = new Error(data?.message || "API処理に失敗しました。");
        error.code = data?.code || "";
        throw error;
    }

    return data;
}

function render(data) {
    currentState = data;

    const metadata = data?.metadata || {};
    const enabled = metadata.viewerEnabled !== false;

    document.getElementById("reportName").textContent =
        metadata.fileName || "有効応募分析";
    document.getElementById("viewerState").textContent =
        enabled ? "閲覧可" : "閲覧停止";
    document.getElementById("viewerUrl").textContent =
        metadata.viewerUrl || "URL未設定";

    const openViewer = document.getElementById("openViewerBtn");
    openViewer.href = metadata.viewerUrl || "#";
    openViewer.style.pointerEvents =
        metadata.viewerUrl && enabled ? "auto" : "none";
    openViewer.style.opacity =
        metadata.viewerUrl && enabled ? "1" : ".45";

    document.getElementById("openSheetBtn").href =
        metadata.spreadsheetUrl || "#";

    const toggle = document.getElementById("toggleViewerBtn");
    toggle.textContent =
        enabled ? "閲覧を停止" : "閲覧を再開";
    toggle.className =
        enabled ? "warning" : "primary";

    document.getElementById("controlArea")
        .classList.remove("hidden");

    setStatus(
        enabled
            ? "Viewerは現在閲覧可能です。"
            : "Viewerは現在閲覧停止中です。",
        enabled ? "ok" : "warn"
    );
}

async function loadState() {
    if (busy) return;
    const key = getKey();

    if (!key) {
        document.getElementById("keyArea")
            .classList.remove("hidden");
        setStatus("社内用アクセスキーを入力してください。","warn");
        return;
    }

    setBusy(true);
    setStatus("Viewer情報を読み込んでいます...");

    try {
        const data = await callApi("manageLoad");
        render(data);
    } catch (error) {
        if (error?.code === "AUTH_INVALID") {
            document.getElementById("keyArea")
                .classList.remove("hidden");
        }
        setStatus(error?.message || String(error),"error");
    } finally {
        setBusy(false);
    }
}

document.getElementById("saveKeyBtn")
    .addEventListener("click", () => {
        const value = s(document.getElementById("accessKeyInput").value);
        if (!value) {
            setStatus("アクセスキーを入力してください。","warn");
            return;
        }
        setKey(value);
        document.getElementById("keyArea").classList.add("hidden");
        loadState();
    });

document.getElementById("copyViewerBtn")
    .addEventListener("click", async () => {
        const url = s(currentState?.metadata?.viewerUrl);
        if (!url) return;
        try {
            await navigator.clipboard.writeText(url);
            setStatus("Viewer URLをコピーしました。","ok");
        } catch (_) {
            window.prompt("Viewer URLをコピーしてください。",url);
        }
    });

document.getElementById("toggleViewerBtn")
    .addEventListener("click", async () => {
        if (busy || !currentState) return;
        const enabled = currentState.metadata?.viewerEnabled !== false;
        const next = !enabled;

        if (!window.confirm(
            next
                ? "Viewerの閲覧を再開しますか？"
                : "Viewerの閲覧を停止しますか？"
        )) return;

        setBusy(true);
        setStatus(next ? "閲覧を再開しています..." : "閲覧を停止しています...");

        try {
            const data = await callApi(
                "manageViewerSetEnabled",
                { viewerEnabled: next }
            );
            render(data);
        } catch (error) {
            setStatus(error?.message || String(error),"error");
        } finally {
            setBusy(false);
        }
    });

document.getElementById("rotateViewerBtn")
    .addEventListener("click", async () => {
        if (busy || !currentState) return;

        if (!window.confirm(
            "Viewer URLを再発行します。以前のURLは無効になります。\n\n企業へ共有済みの場合は、新しいURLの再案内が必要です。\n\n実行しますか？"
        )) return;

        setBusy(true);
        setStatus("Viewer URLを再発行しています...");

        try {
            const data = await callApi("manageViewerRotate");
            render(data);
            setStatus("Viewer URLを再発行しました。新しいURLをご利用ください。","ok");
        } catch (error) {
            setStatus(error?.message || String(error),"error");
        } finally {
            setBusy(false);
        }
    });

loadState();
</script>
</body>
</html>
